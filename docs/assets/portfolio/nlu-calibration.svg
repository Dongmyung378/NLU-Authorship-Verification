<text x="48" y="104" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">같은 최종 4,708쌍과 고정 입력 순서에서 온도 보정 전후를 비교했습니다. ECE는 작을수록 좋습니다.</text>
