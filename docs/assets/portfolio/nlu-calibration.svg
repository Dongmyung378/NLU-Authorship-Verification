<text x="1138" y="625" fill="#64696B" font-size="22" font-weight="400" text-anchor="end">동일 저자 확률 ECE</text>
<text x="48" y="676" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">ECE는 동일 너비의 10개 확률 구간에서 평균 확률과 실제 동일 저자 비율의 차이를 가중한 값입니다.</text>
<text x="48" y="705" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">보정값은 별도 1,569쌍에서 맞추고 최종 평가 전에 고정했습니다. 최종 평가에서 다시 맞추지 않았습니다.</text>
<text x="48" y="734" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">확률 보정은 정답이나 F1이 늘어나는 것을 보장하지 않습니다.</text>
