<title id="title">같은 입력 순서에서의 확률 보정 전후 ECE</title>
<desc id="desc">고정 입력 순서를 유지하고 같은 최종 4,708쌍에서 온도 보정 전후의 동일 저자 확률 ECE를 비교했습니다. Large 커스텀 ASL은 ASL의 비대칭 focusing을 적용한 클래스별 비대칭 이진 softmax focal 변형입니다. 공식 ASL 또는 ASLSingleLabel 코드의 기본 설정을 그대로 재현한 실험과 구분합니다. 세 모델 모두 ECE가 감소했으며 작을수록 좋습니다.</desc>
