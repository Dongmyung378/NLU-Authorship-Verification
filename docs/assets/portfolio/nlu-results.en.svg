<title id="title">Frozen authorship-verification pipelines</title>
<desc id="desc">The style ensemble, RoBERTa-Large CE and custom ASL share the same document-disjoint 4,708 pairs. Custom ASL is a binary focal variant with ASL's asymmetric focusing: gamma 2 and 1 on the true-class softmax probability. This is distinct from reproducing official ASL or ASLSingleLabel defaults. Deployed Large CE was chosen before final evaluation.</desc>
