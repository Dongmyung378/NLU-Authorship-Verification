<text x="48" y="656" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">CE는 모델 선택 집합에서 정한 배포 모델입니다. 최종 평가에서 focal의 점수가 높아도 선택을 바꾸지 않았습니다.</text>
<text x="48" y="685" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">커스텀 ASL은 비대칭 이진 focal 변형입니다. 공식 코드의 기본 설정을 그대로 재현한 실험과 구분합니다.</text>
<text x="48" y="714" fill="#64696B" font-size="20" font-weight="400" text-anchor="start">최초 개발 F1 0.8348과 평가 조건이 다르므로 통제된 전후 개선량으로 비교하지 않습니다.</text>
