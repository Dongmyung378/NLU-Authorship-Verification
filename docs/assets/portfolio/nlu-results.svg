<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="title desc">
<title id="title">동일 저자 판별의 고정 파이프라인 비교</title>
<desc id="desc">문서가 분리된 같은 4,708쌍에서 문체 앙상블과 RoBERTa-Large CE 및 커스텀 ASL을 비교합니다. ASL의 비대칭 focusing을 적용한 커스텀 이진 focal 변형으로, 클래스별 softmax 정답 확률에 gamma 2와 1을 적용합니다. 공식 ASL 또는 ASLSingleLabel 코드의 기본 설정을 그대로 재현한 실험과 구분합니다. 배포용 Large는 평가 전에 선택된 CE입니다.</desc>
<style>text{font-family:'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;font-variant-numeric:tabular-nums} .axis{fill:#64696B}</style>
