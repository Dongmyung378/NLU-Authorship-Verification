<text x="48" y="64" fill="#39272A" font-size="36" font-weight="750" text-anchor="start">동일 조건에서 비교한 세 모델의 판별 성능</text>
<text x="48" y="104" fill="#64696B" font-size="22" font-weight="400" text-anchor="start">문서가 분리된 최종 4,708쌍. 입력 순서와 확률 보정을 포함한 고정 파이프라인의 결과입니다.</text>
