<title id="title">ECE before and after calibration at fixed input order</title>
<desc id="desc">Temperature calibration compares same-author probability ECE on the same final 4,708 pairs at fixed input order. Large custom ASL is a class-dependent binary softmax focal variant using ASL's asymmetric focusing, distinct from reproducing official ASL or ASLSingleLabel defaults. ECE decreased for all models; lower is better.</desc>
